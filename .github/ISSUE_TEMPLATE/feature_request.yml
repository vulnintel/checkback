name: Feature request
description: Suggest a new rule, lock file format or improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What mistake or situation should checkback help with? A real-world example (without secrets) helps.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: For a new rule, describe what should match and what must not, to avoid false positives.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This does not need checkback to upload code, connect to my database or run an AI by itself.
